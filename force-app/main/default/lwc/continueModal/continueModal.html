<template>
    <template if:true={showModal}>

        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open"
        >

            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Order Added to Cart
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <p class="slds-text-heading_small slds-m-bottom_medium">
                        Your order has been added to your cart.
                    </p>

                    <p>
                        Would you like to continue adding another order,
                        or would you like to proceed to your cart?
                    </p>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Add More Orders"
                        variant="neutral"
                        onclick={handleContinue}>
                    </lightning-button>

                    <lightning-button
                        label="Go to Cart"
                        variant="brand"
                        onclick={handleCart}>
                    </lightning-button>1596

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>
</template>
