<template>
  <lightning-card title="Virus Order Form" class="slds-p-around_medium">

     <lightning-combobox
    name="virusType"
    label="Virus Type"
    value={virusType}
    options={virusTypeOptions}
    onchange={handleInputChange}>
  </lightning-combobox>

  <c-neuroinventory-filter
    virus-type={virusType}
    onselectionchange={handleDnaSelectionChange}>
  </c-neuroinventory-filter>

  <c-dna-entry-form
    dna-name={selectedDnaName}
    is-editable
    ondnaupdate={handleDnaNameUpdate}>
  </c-dna-entry-form>

  <lightning-input
    name="expressionConstructName"
    label="Expression Construct Name"
    value={expressionConstructName}
    onchange={handleInputChange}>
  </lightning-input>
    <section class="slds-section slds-m-bottom_medium">
      <h2 class="slds-text-heading_small slds-p-bottom_x-small">Virus Order Details</h2>
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-2 slds-p-right_small">
          <lightning-combobox
            name="virusType"
            label="Select Virus Type"
            options={virusTypeOptions}
            value={virusType}
            onchange={handleInputChange}>
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-p-left_small">
          <lightning-input
            name="endVolume"
            label="End Volume (µL)"
            type="number"
            min="0"
            value={endVolume}
            onchange={handleInputChange}>
          </lightning-input>
        </div>
      </div>

      <template if:true={showCloningOptions}>
        <div class="slds-grid slds-wrap slds-m-top_medium">
          <div class="slds-col slds-size_1-of-2 slds-p-right_small">
            <lightning-combobox
              name="needCloning"
              label="Will you need cloning?"
              options={yesNoOptions}
              value={needCloning}
              onchange={handleInputChange}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-p-left_small">
            <lightning-input
              name="endUse"
              label="End Use"
              value={endUse}
              onchange={handleInputChange}>
            </lightning-input>
          </div>
        </div>
      </template>
    </section>

    <section class="slds-section slds-m-bottom_medium">
      <h2 class="slds-text-heading_small slds-p-bottom_x-small">Expression Construct Details</h2>
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-2 slds-p-right_small">
          <lightning-input
            name="expressionConstructName"
            label="Expression Construct Name"
            value={expressionConstructName}
            onchange={handleInputChange}>
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-p-left_small">
          <lightning-input
            name="constructFullLength"
            label="Construct Full Length"
            type="number"
            min="0"
            value={constructFullLength}
            onchange={handleInputChange}>
          </lightning-input>
        </div>
      </div>

      <template if:true={showFluorescence}>
        <div class="slds-grid slds-wrap slds-m-top_medium">
          <div class="slds-col slds-size_1-of-2 slds-p-right_small">
            <lightning-combobox
              name="expectedFluorescence"
              label="Expected Fluorescence"
              options={fluorescenceOptions}
              value={expectedFluorescence}
              onchange={handleInputChange}>
            </lightning-combobox>
          </div>
          <template if:true={showOtherFluorescence}>
            <div class="slds-col slds-size_1-of-2 slds-p-left_small">
              <lightning-input
                name="expectedFluorescenceOther"
                label="Expected Fluorescence (Other)"
                value={expectedFluorescenceOther}
                onchange={handleInputChange}>
              </lightning-input>
            </div>
          </template>
        </div>
      </template>

      <div class="slds-m-top_medium">
        <lightning-input
          name="expressionConstructAlias"
          label="Expression Construct Alias"
          value={expressionConstructAlias}
          onchange={handleInputChange}>
        </lightning-input>
      </div>

      <div class="slds-m-top_medium">
        <lightning-file-upload
          label="Upload Plasmid Map (optional)"
          accept=".pdf,.png,.jpg"
          record-id={recordId}
          onuploadfinished={handleFileUpload}>
        </lightning-file-upload>
      </div>

      <div class="slds-m-top_medium slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-2 slds-p-right_small">
          <lightning-input
            name="itrLength"
            label="ITR-ITR Length"
            type="number"
            min="0"
            value={itrLength}
            onchange={handleInputChange}>
          </lightning-input>
        </div>
      </div>
    </section>

    <section class="slds-section slds-m-bottom_medium">
      <h2 class="slds-text-heading_small slds-p-bottom_x-small">Capsid Details</h2>
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-2 slds-p-right_small">
          <lightning-combobox
            name="capsid"
            label="Select a Capsid"
            options={capsidOptions}
            value={capsid}
            onchange={handleInputChange}>
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-p-left_small">
          <lightning-input
            name="notes"
            label="Notes"
            value={notes}
            onchange={handleInputChange}>
          </lightning-input>
        </div>
      </div>
    </section>

    <section class="slds-section slds-m-bottom_medium">
      <h2 class="slds-text-heading_small slds-p-bottom_x-small">Client Notes</h2>
      <lightning-textarea
        name="clientNotes"
        label="Client Notes"
        value={clientNotes}
        onchange={handleInputChange}>
      </lightning-textarea>
    </section>

    <section class="slds-section slds-m-bottom_medium">
      <h2 class="slds-text-heading_small slds-p-bottom_x-small">Billing</h2>
      <lightning-input
        name="chartfieldString"
        label="Chartfield String"
        value={chartfieldString}
        onchange={handleInputChange}>
      </lightning-input>

      <div class="slds-m-top_medium slds-text-heading_medium slds-text-align_right">
        Virus Order Total: <strong>{virusOrderTotal}</strong>
      </div>
    </section>
  </lightning-card>
</template>
