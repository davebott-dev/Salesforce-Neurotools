<template>
    <div class="cart-wrapper">
        <div class="cart-container" onclick={handleCartClick}>
            <!-- Cart Icon -->
            <lightning-icon icon-name='utility:cart' alternative-text='cart' size='large' title='cart'></lightning-icon>

            <!-- Badge for item count -->
            <template if:true={cartCount}>
                <span class="cart-badge">{cartCount}</span>
            </template>
        </div>
    </div>
</template>
