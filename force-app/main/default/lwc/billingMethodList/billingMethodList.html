<template>

    <div class="billing-container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <div class="header">

            <div class="header-content">

                <div class="header-icon">
                    <lightning-icon
                        icon-name={headerIcon}
                        size="medium"
                        alternative-text={pageTitle}>
                    </lightning-icon>
                </div>

                <div class="header-text">

                    <h1 class="slds-text-heading_large">
                        {pageTitle}
                    </h1>

                    <p class="header-description">
                        {pageDescription}
                    </p>

                </div>

            </div>


            <div class="header-actions">

                <lightning-button
                    variant="brand"
                    label={addButtonLabel}
                    icon-name="utility:add"
                    onclick={handleAdd}>
                </lightning-button>

            </div>

        </div>


        <!-- =====================================================
             SUMMARY
             ===================================================== -->

        <template if:false={isLoading}>

            <div class="summary-bar">

                <div class="summary-item">

                    <span class="summary-label">
                        Total
                    </span>

                    <span class="summary-value">
                        {totalCount}
                    </span>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        Active
                    </span>

                    <span class="summary-value">
                        {activeCount}
                    </span>

                </div>

            </div>

        </template>


        <!-- =====================================================
             LOADING
             ===================================================== -->

        <template if:true={isLoading}>

            <div class="loading-container">

                <lightning-spinner
                    alternative-text="Loading billing methods"
                    size="medium">
                </lightning-spinner>

                <p>
                    Loading {pageTitle}...
                </p>

            </div>

        </template>


        <!-- =====================================================
             ERROR
             ===================================================== -->

        <template if:true={hasError}>

            <div
                class="error-container"
                role="alert">

                <lightning-icon
                    icon-name="utility:error"
                    size="small"
                    alternative-text="Error">
                </lightning-icon>

                <div class="error-content">

                    <h2>
                        Unable to load {pageTitle}
                    </h2>

                    <p>
                        {errorMessage}
                    </p>

                    <lightning-button
                        variant="neutral"
                        label="Try Again"
                        onclick={handleRetry}>
                    </lightning-button>

                </div>

            </div>

        </template>


        <!-- =====================================================
             BILLING METHOD CARDS
             ===================================================== -->

        <template if:false={isLoading}>

            <template if:true={hasBillingMethods}>

                <div class="card-grid">

                    <template
                        for:each={billingMethods}
                        for:item="method">

                        <article
                            key={method.id}
                            class="billing-card">

                            <!-- CARD HEADER -->

                            <div class="card-header">

                                <div class="card-title-container">

                                    <h2 class="card-title">
                                        {method.name}
                                    </h2>

                                    <p class="card-type">
                                        {method.type}
                                    </p>

                                </div>


                                <span class={method.statusClass}>
                                    {method.status}
                                </span>

                            </div>


                            <!-- CARD BODY -->

                            <div class="card-body">

                                <template
                                    for:each={method.fields}
                                    for:item="field">

                                    <div
                                        key={field.label}
                                        class="field-row">

                                        <span class="field-label">
                                            {field.label}
                                        </span>

                                        <span class="field-value">
                                            {field.value}
                                        </span>

                                    </div>

                                </template>

                            </div>


                            <!-- CARD FOOTER -->

                            <div class="card-footer">

                                <span class="footer-text">
                                    {method.footerText}
                                </span>


                                <div class="card-actions">

                                    <lightning-button
                                        variant="base"
                                        label="View"
                                        data-id={method.id}
                                        onclick={handleView}>
                                    </lightning-button>

                                    <lightning-button
                                        variant="base"
                                        label="Edit"
                                        data-id={method.id}
                                        onclick={handleEdit}>
                                    </lightning-button>

                                </div>

                            </div>

                        </article>

                    </template>

                </div>

            </template>


            <!-- =================================================
                 EMPTY STATE
                 ================================================= -->

            <template if:false={hasBillingMethods}>

                <template if:false={hasError}>

                    <div class="empty-state">

                        <div class="empty-icon">

                            <lightning-icon
                                icon-name={headerIcon}
                                size="large"
                                alternative-text="">
                            </lightning-icon>

                        </div>

                        <h2>
                            {emptyStateTitle}
                        </h2>

                        <p>
                            {emptyStateMessage}
                        </p>

                        <lightning-button
                            variant="brand"
                            label={addButtonLabel}
                            icon-name="utility:add"
                            onclick={handleAdd}>
                        </lightning-button>

                    </div>

                </template>

            </template>

        </template>


        <!-- =====================================================
             MODAL
             ===================================================== -->

        <template if:true={showModal}>

            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="modal-heading"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <!-- MODAL HEADER -->

                    <header class="slds-modal__header">

                        <button
                            class="slds-button slds-button_icon slds-modal__close"
                            title="Close"
                            onclick={handleCloseModal}>

                            <lightning-icon
                                icon-name="utility:close"
                                size="small"
                                alternative-text="Close">
                            </lightning-icon>

                            <span class="slds-assistive-text">
                                Close
                            </span>

                        </button>

                        <h2
                            id="modal-heading"
                            class="slds-text-heading_medium">

                            {modalTitle}

                        </h2>

                    </header>


<!-- =====================================================
     MODAL BODY
     ===================================================== -->

<div class="slds-modal__content slds-p-around_medium">

    <!-- VIEW / EDIT EXISTING BILLING METHOD -->

    <template if:true={selectedBillingMethod}>

        <template
            for:each={selectedBillingMethod.fields}
            for:item="field">

            <div
                key={field.label}
                class="modal-field">

                <span class="field-label">
                    {field.label}
                </span>

                <span class="field-value">
                    {field.value}
                </span>

            </div>

        </template>

    </template>


    <!-- ADD NEW BILLING METHOD -->

    <template if:false={selectedBillingMethod}>

        <template if:true={flowApiName}>

           <lightning-flow
    flow-api-name={flowApiName}
    flow-input-variables={flowInputVariables}
    onstatuschange={handleFlowStatusChange}>
</lightning-flow>

        </template>

    </template>

</div>


                    <!-- MODAL FOOTER -->

                    <footer class="slds-modal__footer">

                        <lightning-button
                            variant="neutral"
                            label="Close"
                            onclick={handleCloseModal}>
                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div
                class="slds-backdrop slds-backdrop_open">
            </div>

        </template>

    </div>

</template>
