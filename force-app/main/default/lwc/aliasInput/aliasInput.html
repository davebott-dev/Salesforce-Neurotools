<template>
    <div class="input-container">

        <!-- Custom Label + Tooltip -->
        <div class="label-row">
            <span class="custom-label">
                DNA Alias
            </span>

            <div class="tooltip-container">
                <lightning-icon
                    icon-name="utility:info"
                    size="xx-small"
                    alternative-text="Help"
                    class="help-icon">
                </lightning-icon>

                <div class="custom-tooltip">
                    Enter the short name of the Expression Construct you want to use for this order. This will be used when naming your virus once your order is completed.
                </div>
            </div>
        </div>

        <!-- Input -->
        <lightning-input
            variant="label-hidden"
            value={aliasOutput}
            onchange={handleChange}
            required
            disabled={isDisabled}>
        </lightning-input>

    </div>
</template>
