<template>
    <lightning-card title="Invoices Related to Shipment" icon-name="custom:custom63">
        <template if:true={invoices.length}>
            <lightning-datatable
                key-field="Id"
                data={invoices}
                columns={columns}
                hide-checkbox-column
            ></lightning-datatable>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error">Error loading invoices.</p>
        </template>

        <template if:true={noData}>
            <p class="slds-p-around_medium">No invoices found for this shipment.</p>
        </template>
    </lightning-card>
</template>
