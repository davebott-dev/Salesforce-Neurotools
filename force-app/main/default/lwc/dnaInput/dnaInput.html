<template>
    <div class="input-container">

        <!-- Custom Label + Help Tooltip -->
        <div class="label-row">
            <span class="custom-label">
                DNA Name
            </span>

            <div class="tooltip-container">
                <lightning-icon
                    icon-name="utility:info"
                    size="xx-small"
                    alternative-text="Help"
                    class="help-icon">
                </lightning-icon>

                <div class="custom-tooltip">
                    Enter the name of the Expression Construct you want to use for this order.
                </div>
            </div>
        </div>

        <!-- Input -->
        <lightning-input
            variant="label-hidden"
            value={dnaNameOutput}
            onchange={handleChange}
            required
            disabled={isDisabled}>
        </lightning-input>

    </div>
</template>
