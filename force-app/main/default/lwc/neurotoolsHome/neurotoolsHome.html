
<template>
    <div class="home-container">
        <!-- Welcome -->
        <section class="welcome-section">
            <div>
                <p class="eyebrow">NEUROTOOLS CLIENT PORTAL</p>
                <h1>Welcome to NeuroTools</h1>
                <p class="welcome-description">
                    Manage your orders, request quotes, access resources,
                    and connect with the NeuroTools team.
                </p>
            </div>
            <button class="primary-button" onclick={handleCreateOrder}>
                <span class="button-symbol">+</span>
                Create an Order
            </button>
        </section>

        <!-- Quick actions -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Quick Actions</h2>
                    <p>Get where you need to go.</p>
                </div>
            </div>

            <div class="quick-actions">
                <button class="action-card" onclick={handleCreateOrder}>
                    <span class="action-icon order-icon">+</span>
                    <span class="action-content">
                        <strong>Create an Order</strong>
                        <span>Start a new virus order.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleGetQuote}>
                    <span class="action-icon quote-icon">$</span>
                    <span class="action-content">
                        <strong>Get a Quote</strong>
                        <span>Request project pricing.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleGetHelp}>
                    <span class="action-icon help-icon">?</span>
                    <span class="action-content">
                        <strong>Ask for Help</strong>
                        <span>Contact the NeuroTools team.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleBilling}>
                    <span class="action-icon billing-icon">$</span>
                    <span class="action-content">
                        <strong>Billing</strong>
                        <span>Manage payment information.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>
            </div>

            <!-- Subtle credit-card promotion -->
            <div class="payment-note">
                <span class="payment-note-icon">✓</span>
                <div>
                    <strong>Make checkout more convenient with a credit card</strong>
                    <p>
                        Save time on future orders by keeping your payment
                        information up to date in Billing. Purchase orders
                        are still accepted.
                    </p>
                </div>
            </div>
        </section>

        <!-- Recent orders -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Recent Orders</h2>
                    <p>Review your NeuroTools orders and their progress.</p>
                </div>
                <button class="text-button" onclick={handleViewAllOrders}>
                    View All Orders <span>→</span>
                </button>
            </div>

            <div class="orders-container">
                <c-client-virus-orders></c-client-virus-orders>
            </div>
        </section>

        <!-- Summary and quick order -->
        <section class="two-column-section">
            <div class="section-card">
                <div class="section-header">
                    <div>
                        <h2>Order Summary</h2>
                        <p>An overview of your orders.</p>
                    </div>
                </div>

                <div class="summary-grid">
                    <button class="summary-item" onclick={handleViewAllOrders}>
                        <span class="summary-number">—</span>
                        <span class="summary-label">Active</span>
                    </button>
                    <button class="summary-item" onclick={handleViewAllOrders}>
                        <span class="summary-number">—</span>
                        <span class="summary-label">In Production</span>
                    </button>
                    <button class="summary-item" onclick={handleViewAllOrders}>
                        <span class="summary-number">—</span>
                        <span class="summary-label">Ready to Ship</span>
                    </button>
                    <button class="summary-item" onclick={handleViewAllOrders}>
                        <span class="summary-number">—</span>
                        <span class="summary-label">Completed</span>
                    </button>
                </div>

                <button class="text-button" onclick={handleViewAllOrders}>
                    View Orders <span>→</span>
                </button>
            </div>

            <div class="section-card">
                <div class="section-header">
                    <div>
                        <h2>Quick Order</h2>
                        <p>Start with a frequently ordered product.</p>
                    </div>
                </div>

                <div class="quick-order-list">
                    <div class="quick-order-item">
                        <div>
                            <strong>AAV Standard</strong>
                            <span>Standard AAV preparation</span>
                        </div>
                        <button class="small-button" data-product="AAV Standard"
                            onclick={handleQuickOrder}>Order</button>
                    </div>

                    <div class="quick-order-item">
                        <div>
                            <strong>AAV Medium</strong>
                            <span>Medium-scale AAV preparation</span>
                        </div>
                        <button class="small-button" data-product="AAV Medium"
                            onclick={handleQuickOrder}>Order</button>
                    </div>

                    <div class="quick-order-item">
                        <div>
                            <strong>Lentivirus</strong>
                            <span>Lentiviral preparation</span>
                        </div>
                        <button class="small-button" data-product="Lentivirus"
                            onclick={handleQuickOrder}>Order</button>
                    </div>
                </div>

                <p class="quick-order-footnote">
                    Selecting a product opens the order page. You can review
                    product details before submitting.
                </p>
            </div>
        </section>

        <!-- Resources -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Resources</h2>
                    <p>Helpful information for working with NeuroTools.</p>
                </div>
            </div>

            <div class="resources-grid">
                <button class="resource-card" onclick={handleCreateOrder}>
                    <span class="resource-icon">↗</span>
                    <strong>Ordering Guide</strong>
                    <span>Get started with a new order.</span>
                </button>

                <button class="resource-card" onclick={handleBulkOrderTemplate}>
                    <span class="resource-icon">⇩</span>
                    <strong>Bulk Order Template</strong>
                    <span>Download the spreadsheet for multiple orders.</span>
                </button>

                <button class="resource-card" onclick={handleGetHelp}>
                    <span class="resource-icon">□</span>
                    <strong>Shipping Information</strong>
                    <span>Ask about shipping options and requirements.</span>
                </button>

                <button class="resource-card" onclick={handleFAQs}>
                    <span class="resource-icon">?</span>
                    <strong>FAQs</strong>
                    <span>Find answers to common questions.</span>
                </button>

                <button class="resource-card" onclick={handleCreateOrder}>
                    <span class="resource-icon">◎</span>
                    <strong>Product Information</strong>
                    <span>Explore available products and services.</span>
                </button>

                <button class="resource-card" onclick={handlePublications}>
                    <span class="resource-icon">▤</span>
                    <strong>Publications</strong>
                    <span>Explore publications associated with NeuroTools.</span>
                </button>
            </div>
        </section>

        <!-- Help -->
        <section class="help-section">
            <div class="help-content">
                <p class="eyebrow">WE'RE HERE TO HELP</p>
                <h2>Need a hand?</h2>
                <p>
                    Have a question about ordering, billing, production,
                    or shipping? Contact the NeuroTools team.
                </p>
            </div>
            <div class="help-actions">
                <button class="help-button" onclick={handleGetHelp}>
                    Contact NeuroTools
                </button>
                <button class="help-secondary-button" onclick={handleFAQs}>
                    View FAQs
                </button>
            </div>
        </section>

        <!-- Separate persistent announcements widget -->
        <c-neurotools-announcements></c-neurotools-announcements>
    </div>
</template>
