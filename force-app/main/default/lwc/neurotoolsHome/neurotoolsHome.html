<template>
    <div class="home-container">
        <!-- Welcome -->
        <section class="welcome-section">
            <div>
                <p class="eyebrow">NEUROTOOLS CLIENT PORTAL</p>
                <h1>Welcome to NeuroTools</h1>
                <p class="welcome-description">
                    Manage your orders, request quotes, access resources,
                    and connect with the NeuroTools team.
                </p>
            </div>

            <button class="primary-button" onclick={handleCreateOrder}>
                <span class="button-symbol">+</span>
                Create an Order
            </button>
        </section>

        <!-- Quick Actions -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Quick Actions</h2>
                    <p>Get where you need to go.</p>
                </div>
            </div>

            <div class="quick-actions">
                <button class="action-card" onclick={handleCreateOrder}>
                    <span class="action-icon order-icon">+</span>
                    <span class="action-content">
                        <strong>Create an Order</strong>
                        <span>Start a new virus order.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleGetQuote}>
                    <span class="action-icon quote-icon">$</span>
                    <span class="action-content">
                        <strong>Get a Quote</strong>
                        <span>Request project pricing.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleGetHelp}>
                    <span class="action-icon help-icon">?</span>
                    <span class="action-content">
                        <strong>Ask for Help</strong>
                        <span>Contact the NeuroTools team.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>

                <button class="action-card" onclick={handleBilling}>
                    <span class="action-icon billing-icon">$</span>
                    <span class="action-content">
                        <strong>Billing &amp; Payments</strong>
                        <span>Manage your billing methods.</span>
                    </span>
                    <span class="action-arrow">→</span>
                </button>
            </div>

            <!-- Credit Card Promotion -->
            <div class="payment-note">
                <span class="payment-note-icon">✓</span>
                <div>
                    <strong>
                        Make checkout more convenient with a credit card
                    </strong>
                    <p>
                        Keep your payment information up to date in Billing.
                        Purchase orders and Chartfield payments remain
                        available where applicable.
                    </p>
                </div>
            </div>
        </section>

        <!-- Recent Orders -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Recent Orders</h2>
                    <p>Your five most recently created orders.</p>
                </div>

                <button
                    class="text-button"
                    onclick={handleViewAllOrders}>
                    View All Orders <span>→</span>
                </button>
            </div>

            <div class="orders-container">
                <template lwc:if={isLoadingDashboard}>
                    <div class="dashboard-message">
                        <lightning-spinner
                            alternative-text="Loading recent orders"
                            size="small">
                        </lightning-spinner>
                        <span>Loading your recent orders...</span>
                    </div>
                </template>

                <template lwc:elseif={dashboardError}>
                    <div class="dashboard-message error-message">
                        {dashboardError}
                    </div>
                </template>

                <template lwc:elseif={hasRecentOrders}>
                    <div class="recent-orders-list">
                        <template
                            for:each={recentOrders}
                            for:item="order">

                            <div
                                class="recent-order-row"
                                key={order.Id}>

                                <div class="recent-order-main">
                                    <a
                                        class="recent-order-number"
                                        href={order.recordLink}>
                                        {order.displayOrderNumber}
                                    </a>

                                    <div class="recent-order-details">
                                        <span>{order.VirusType}</span>

                                        <template lwc:if={order.Construct}>
                                            <span class="detail-separator">
                                                ·
                                            </span>
                                            <span>{order.Construct}</span>
                                        </template>
                                    </div>

                                    <div class="recent-order-date">
                                        Created
                                        <lightning-formatted-date-time
                                            value={order.CreatedDate}
                                            year="numeric"
                                            month="short"
                                            day="2-digit">
                                        </lightning-formatted-date-time>
                                    </div>
                                </div>

                                <span class={order.stageClass}>
                                    {order.Stage}
                                </span>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:else>
                    <div class="dashboard-message empty-message">
                        <strong>No orders to display yet.</strong>
                        <span>
                            Your lab's recent orders will appear here.
                        </span>
                        <button
                            class="text-button"
                            onclick={handleCreateOrder}>
                            Create an Order <span>→</span>
                        </button>
                    </div>
                </template>
            </div>
        </section>

        <!-- Order Summary and Quick Order -->
<section class="two-column-section">

    <!-- Order Summary -->
    <div class="section-card">
        <div class="section-header">
            <div>
                <h2>Order Summary</h2>
                <p>An overview of your orders.</p>
            </div>
        </div>

        <div class="summary-grid">
            <button class="summary-item" onclick={handleViewAllOrders}>
                <span class="summary-number">
                    <template lwc:if={isLoadingDashboard}>—</template>
                    <template lwc:else>{orderSummary.active}</template>
                </span>
                <span class="summary-label">Active</span>
            </button>

            <button class="summary-item" onclick={handleViewAllOrders}>
                <span class="summary-number">
                    <template lwc:if={isLoadingDashboard}>—</template>
                    <template lwc:else>{orderSummary.inProduction}</template>
                </span>
                <span class="summary-label">In Production</span>
            </button>

            <button class="summary-item" onclick={handleViewAllOrders}>
                <span class="summary-number">
                    <template lwc:if={isLoadingDashboard}>—</template>
                    <template lwc:else>{orderSummary.readyToShip}</template>
                </span>
                <span class="summary-label">Ready to Ship</span>
            </button>

            <button class="summary-item" onclick={handleViewAllOrders}>
                <span class="summary-number">
                    <template lwc:if={isLoadingDashboard}>—</template>
                    <template lwc:else>{orderSummary.completed}</template>
                </span>
                <span class="summary-label">Completed</span>
            </button>
        </div>

        <template lwc:if={dashboardError}>
            <p class="summary-error">
                Order counts are temporarily unavailable. Please refresh the page.
            </p>
        </template>
    </div>

   
<!-- Quick Order: Popular Stock -->
<div class="section-card quick-order-section">
    <div class="section-header">
        <div>
            <h2>Quick Order</h2>
            <p>
                Below are some of our most requested stock product. Select one to view available batches
                and add it to your cart!
            </p>
        </div>
    </div>

    <template lwc:if={isLoadingStock}>
        <div class="stock-loading">
            <lightning-spinner
                alternative-text="Loading popular stock"
                size="small">
            </lightning-spinner>
            <span>Loading available stock...</span>
        </div>
    </template>

    <template lwc:elseif={stockError}>
        <div class="stock-message stock-error">
            {stockError}
            <button
                class="text-button"
                onclick={loadStockProducts}>
                Try Again →
            </button>
        </div>
    </template>

    <template lwc:elseif={stockProducts.length}>
        <div class="quick-order-list">

            <template
                for:each={stockProducts}
                for:item="product">

                <article
                    class="quick-order-row"
                    key={product.Id}>

                    <!-- Product Information -->
                    <div class="quick-order-product">
                        <div class="quick-order-product-heading">
                            <h3>{product.Name}</h3>

                            <span class="stock-product-type">
                                {product.Virus_Type__c}
                            </span>
                        </div>

                        <p class="quick-order-description">
                            {product.cardDescription}
                        </p>
                    </div>

                    <!-- Inventory Information -->
                    <div class="quick-order-inventory">
                        <div class="quick-order-inventory-count">
                            <strong>{product.TubesRemaining}</strong>
                            <span>tubes</span>
                        </div>

                        <span class="batch-count">
                            {product.batchCount} available batch(es)
                        </span>
                    </div>

                    <!-- Availability -->
                    <div class="quick-order-status">
                        <template lwc:if={product.hasAvailableBatches}>
                            <span class="stock-availability">
                                In Stock
                            </span>
                        </template>

                        <template lwc:else>
                            <span class="stock-unavailable">
                                Unavailable
                            </span>
                        </template>
                    </div>

                    <!-- View Stock -->
                    <div class="quick-order-action">
                        <button
                            type="button"
                            class="quick-order-select-button"
                            data-id={product.Id}
                            onclick={handleSelectStockProduct}
                            disabled={product.isUnavailable}>

                            View Stock
                            <span aria-hidden="true">→</span>
                        </button>
                    </div>

                </article>
            </template>
        </div>
    </template>

    <template lwc:else>
        <div class="stock-message">
            No featured stock products are currently available.
        </div>
    </template>

    <p class="quick-order-footnote">
        Inventory and titers are based on currently available stock batches.
        Availability may change as orders are submitted.
    </p>
</div>

</section>

<!-- Quick Order Stock Selection Modal -->
<template lwc:if={stockModalOpen}>
    <div class="stock-modal-overlay">

        <button
            type="button"
            class="stock-modal-backdrop"
            aria-label="Close stock selection"
            onclick={closeStockModal}>
        </button>

        <section
            class="stock-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="stock-modal-title">

            <button
                type="button"
                class="stock-modal-close"
                aria-label="Close"
                onclick={closeStockModal}>
                ×
            </button>

            <header class="stock-modal-header">
                <p class="eyebrow">QUICK ORDER</p>
                <h2 id="stock-modal-title">{selectedProductTitle}</h2>
                <p>
                    Review the product specifications, select an available
                    batch, and choose the number of tubes to add to your cart.
                </p>
            </header>

            <div class="stock-modal-body">

                <!-- Product Details -->
                <div class="stock-detail-panel">
                    <h3>Product Information</h3>

                    <dl class="stock-detail-grid">
                        <div>
                            <dt>Virus Type</dt>
                            <dd>{selectedProductType}</dd>
                        </div>

                        <div>
                            <dt>Construct</dt>
                            <dd>{selectedProductConstruct}</dd>
                        </div>

                        <div>
                            <dt>Capsid / Envelope</dt>
                            <dd>{selectedProductCapsid}</dd>
                        </div>

                        <div>
                            <dt>End Use</dt>
                            <dd>{selectedProductEndUse}</dd>
                        </div>
                    </dl>
                </div>

                <!-- Batch Selection -->
                <div class="stock-selection-panel">
                    <h3>Available Stock Batches</h3>

                    <lightning-combobox
                        name="stockBatch"
                        label="Select a batch"
                        value={selectedBatchId}
                        options={batchOptions}
                        onchange={handleBatchChange}
                        placeholder="Select an available batch">
                    </lightning-combobox>

                    <template lwc:if={selectedBatch}>
                        <div class="selected-batch-details">
                            <div class="selected-batch-item">
                                <span>Batch / Transfection ID</span>
                                <strong>{selectedBatch.batchLabel}</strong>
                            </div>

                            <div class="selected-batch-item">
                                <span>Titer</span>
                                <strong>{selectedBatchTiter}</strong>
                            </div>

                            <div class="selected-batch-item">
                                <span>End Volume</span>
                                <strong>{selectedBatchVolume}</strong>
                            </div>

                            <div class="selected-batch-item">
                                <span>Tubes Remaining</span>
                                <strong>{selectedBatchTubesRemaining}</strong>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Requested Quantity -->
                <div class="stock-quantity-panel">
                    <lightning-input
                        type="number"
                        name="requestedTubes"
                        label="Number of Tubes"
                        value={requestedTubes}
                        min="1"
                        max={maxRequestedTubes}
                        step="1"
                        onchange={handleTubeQuantityChange}>
                    </lightning-input>

                    <p class="stock-quantity-help">
                        Maximum available quantity:
                        <strong>{selectedBatchTubesRemaining}</strong>
                        tube(s).
                    </p>
                </div>

                <div class="stock-order-note">
                    <strong>Before adding to your cart</strong>
                    <p>
                        Your selected batch and tube quantity will be used
                        to create a draft virus order in your existing cart.
                    </p>
                </div>
            </div>

            <footer class="stock-modal-footer">
                <button
                    type="button"
                    class="help-secondary-button"
                    onclick={closeStockModal}
                    disabled={isAddingToCart}>
                    Cancel
                </button>

                <button
                    type="button"
                    class="primary-button"
                    onclick={handleAddStockToCart}
                    disabled={isAddToCartDisabled}>
                    <template lwc:if={isAddingToCart}>
                        Adding to Cart...
                    </template>
                    <template lwc:else>
                        Add to Cart →
                    </template>
                </button>
            </footer>
        </section>
    </div>
</template>


        <!-- Resources -->
        <section class="section">
            <div class="section-header">
                <div>
                    <h2>Resources</h2>
                    <p>Helpful information for working with NeuroTools.</p>
                </div>
            </div>

            <div class="resources-grid">
                <button
                    class="resource-card"
                    onclick={handleOrderingGuide}>
                    <span class="resource-icon">↗</span>
                    <strong>Ordering Guide</strong>
                    <span>Get started with a new order.</span>
                </button>

                <button
                    class="resource-card"
                    onclick={handleBulkOrderTemplate}>
                    <span class="resource-icon">⇩</span>
                    <strong>Bulk Order Template</strong>
                    <span>
                        Download the spreadsheet for multiple orders.
                    </span>
                </button>

                <button
                    class="resource-card"
                    onclick={handleShippingInfo}>
                    <span class="resource-icon">□</span>
                    <strong>Shipping Information</strong>
                    <span>
                        Ask about shipping options and requirements.
                    </span>
                </button>

                <button
                    class="resource-card"
                    onclick={handleFAQs}>
                    <span class="resource-icon">?</span>
                    <strong>FAQs</strong>
                    <span>Find answers to common questions.</span>
                </button>

                <button
                    class="resource-card"
                    onclick={handleProducts}>
                    <span class="resource-icon">◎</span>
                    <strong>Product Information</strong>
                    <span>
                        Explore available products and services.
                    </span>
                </button>

                <button
                    class="resource-card"
                    onclick={handlePublications}>
                    <span class="resource-icon">▤</span>
                    <strong>Publications</strong>
                    <span>
                        Explore publications associated with NeuroTools.
                    </span>
                </button>
            </div>
        </section>

        <!-- Help -->
       
<section class="help-section">
    <div class="help-content">
        <p class="eyebrow">WE'RE HERE TO HELP</p>
        <h2>Need a hand?</h2>
        <p>
            Have a question about ordering, billing, production,
            or shipping? Contact the NeuroTools team.
        </p>

        <div class="shipping-address">
            <h3>Shipping Address</h3>
            <p>
                Ritola Lab<br>
                Mary Ellen Jones Building<br>
                116 Manning Drive<br>
                5102 UNC Neuroscience Center Campus Box 7250<br>
                Chapel Hill, NC 27599<br>
            </p>
        </div>
    </div>

    <div class="help-actions">
        <button
            class="help-button"
            onclick={handleContactEmail}>
            Contact NeuroTools
        </button>

        <button
            class="help-secondary-button"
            onclick={handleFAQs}>
            View FAQs
        </button>
    </div>
</section>


        <!-- Billing Modal -->
        <template lwc:if={billingModalOpen}>
            <div class="billing-modal-overlay">

                <!-- Clicking outside the dialog closes it -->
                <button
                    type="button"
                    class="billing-modal-backdrop"
                    onclick={closeBillingModal}
                    aria-label="Close billing dialog">
                </button>

                <section
                    class="billing-modal"
                    role="dialog"
                    tabindex="-1"
                    aria-modal="true"
                    aria-labelledby="billing-modal-heading">

                    <header class="billing-modal-header">
                        <div>
                            <p class="eyebrow">ACCOUNT MANAGEMENT</p>
                            <h2 id="billing-modal-heading">
                                Choose a Billing Method
                            </h2>
                            <p>
                                Select the billing method you want to manage.
                            </p>
                        </div>

                        <button
                            type="button"
                            class="billing-close-button"
                            onclick={closeBillingModal}
                            aria-label="Close billing dialog">
                            ×
                        </button>
                    </header>

                    <div class="billing-modal-content">
                        <template
                            for:each={billingOptions}
                            for:item="option">

                            <button
                                key={option.id}
                                type="button"
                                class="billing-option"
                                data-id={option.id}
                                onclick={handleBillingOption}>

                                <span class="billing-option-icon">
                                    <lightning-icon
                                        icon-name={option.icon}
                                        size="medium"
                                        alternative-text="">
                                    </lightning-icon>
                                </span>

                                <span class="billing-option-text">
                                    <strong>{option.label}</strong>
                                    <span>{option.description}</span>
                                </span>

                                <span class="billing-option-arrow">
                                    →
                                </span>
                            </button>
                        </template>
                    </div>

                    <footer class="billing-modal-footer">
                        <button
                            type="button"
                            class="help-secondary-button"
                            onclick={closeBillingModal}>
                            Cancel
                        </button>
                    </footer>
                </section>
            </div>
        </template>

        <!-- Separate Persistent Announcements Widget -->
        <c-neurotools-announcements></c-neurotools-announcements>
    </div>
</template>
