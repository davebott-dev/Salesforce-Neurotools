<template>

    <div class="quote-container">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="header">

            <div>

                <h1 class="title">
                    Request a Quote
                </h1>

                <p class="subtitle">
                    Select the products and quantities you are interested in.
                    Your estimated quote will appear on the right.
                </p>

            </div>

        </div>


        <!-- =====================================================
             LOADING
        ====================================================== -->

        <template if:true={isLoading}>

            <div class="loading-state">

                <lightning-spinner
                    alternative-text="Loading products"
                    size="medium">
                </lightning-spinner>

                <p>
                    Loading available products...
                </p>

            </div>

        </template>


        <!-- =====================================================
             ERROR
        ====================================================== -->

        <template if:true={hasError}>

            <div class="error-state">

                <h3>
                    Unable to load products
                </h3>

                <p>
                    {errorMessage}
                </p>

                <button
                    class="quote-button"
                    onclick={loadProducts}
                >
                    Try Again
                </button>

            </div>

        </template>


        <!-- =====================================================
             MAIN CONTENT
        ====================================================== -->

        <template if:true={hasProducts}>

            <div class="quote-layout">


                <!-- =================================================
                     LEFT: PRODUCT SELECTION
                ================================================== -->

                <div class="products-panel">


                    <!-- =============================================
                         AAV
                    ============================================== -->

                    <template if:true={aavProducts.length}>

                        <section class="product-section">

                            <div class="section-header">

                                <div>

                                    <h2>AAV</h2>

                                    <p>
                                        Select one or more AAV products.
                                    </p>

                                </div>

                            </div>


                            <div class="product-grid">

                                <template
                                    for:each={aavProducts}
                                    for:item="product"
                                >

                                    <button
                                        key={product.id}
                                        class={product.cssClass}
                                        data-id={product.id}
                                        onclick={handleProductSelect}
                                    >

                                        <div class="product-name">
                                            {product.name}
                                        </div>

                                        <div class="product-description">
                                            {product.description}
                                        </div>

                                        <div class="product-price">
                                            {product.displayPrice}
                                        </div>

                                    </button>

                                </template>

                            </div>

                        </section>

                    </template>



                    <!-- =============================================
                         HSV
                    ============================================== -->

                    <template if:true={hsvProducts.length}>

                        <section class="product-section">

                            <div class="section-header">

                                <div>

                                    <h2>HSV</h2>

                                    <p>
                                        Select one or more HSV products.
                                    </p>

                                </div>

                            </div>


                            <div class="product-grid">

                                <template
                                    for:each={hsvProducts}
                                    for:item="product"
                                >

                                    <button
                                        key={product.id}
                                        class={product.cssClass}
                                        data-id={product.id}
                                        onclick={handleProductSelect}
                                    >

                                        <div class="product-name">
                                            {product.name}
                                        </div>

                                        <div class="product-description">
                                            {product.description}
                                        </div>

                                        <div class="product-price">
                                            {product.displayPrice}
                                        </div>

                                    </button>

                                </template>

                            </div>

                        </section>

                    </template>



                    <!-- =============================================
                         LENTIVIRUS
                    ============================================== -->

                    <template if:true={lentiProducts.length}>

                        <section class="product-section">

                            <div class="section-header">

                                <div>

                                    <h2>Lentivirus</h2>

                                    <p>
                                        Select one or more lentivirus products.
                                    </p>

                                </div>

                            </div>


                            <div class="product-grid">

                                <template
                                    for:each={lentiProducts}
                                    for:item="product"
                                >

                                    <button
                                        key={product.id}
                                        class={product.cssClass}
                                        data-id={product.id}
                                        onclick={handleProductSelect}
                                    >

                                        <div class="product-name">
                                            {product.name}
                                        </div>

                                        <div class="product-description">
                                            {product.description}
                                        </div>

                                        <div class="product-price">
                                            {product.displayPrice}
                                        </div>

                                    </button>

                                </template>

                            </div>

                        </section>

                    </template>



                    <!-- =============================================
                         RABIES
                    ============================================== -->

                    <template if:true={rabiesProducts.length}>

                        <section class="product-section">

                            <div class="section-header">

                                <div>

                                    <h2>Rabies</h2>

                                    <p>
                                        Select one or more rabies products.
                                    </p>

                                </div>

                            </div>


                            <div class="product-grid">

                                <template
                                    for:each={rabiesProducts}
                                    for:item="product"
                                >

                                    <button
                                        key={product.id}
                                        class={product.cssClass}
                                        data-id={product.id}
                                        onclick={handleProductSelect}
                                    >

                                        <div class="product-name">
                                            {product.name}
                                        </div>

                                        <div class="product-description">
                                            {product.description}
                                        </div>

                                        <div class="product-price">
                                            {product.displayPrice}
                                        </div>

                                    </button>

                                </template>

                            </div>

                        </section>

                    </template>



                    <!-- =============================================
                         ADDITIONAL SERVICES
                    ============================================== -->

                    <template if:true={addOnProducts.length}>

                        <section class="product-section">

                            <div class="section-header">

                                <div>

                                    <h2>Additional Services</h2>

                                    <p>
                                        Add optional services to your quote.
                                    </p>

                                </div>

                            </div>


                            <div class="addon-list">

                                <template
                                    for:each={addOnProducts}
                                    for:item="product"
                                >

                                    <div
                                        key={product.id}
                                        class="addon-row"
                                    >

                                        <div class="addon-info">

                                            <div class="product-name">
                                                {product.name}
                                            </div>

                                            <div class="product-description">
                                                {product.description}
                                            </div>

                                            <div class="product-price">
                                                {product.displayPrice}
                                            </div>

                                        </div>


                                        <lightning-input
                                            type="checkbox"
                                            data-id={product.id}
                                            checked={product.selected}
                                            onchange={handleAddOnChange}
                                            variant="label-hidden"
                                        >
                                        </lightning-input>

                                    </div>

                                </template>

                            </div>

                        </section>

                    </template>

                </div>



                <!-- =================================================
                     RIGHT: QUOTE SUMMARY
                ================================================== -->

                <aside class="summary-panel">

                    <div class="summary-header">

                        <h2>
                            Quote Summary
                        </h2>

                        <template if:true={hasSelections}>

                            <button
                                class="clear-button"
                                onclick={handleClear}
                            >
                                Clear
                            </button>

                        </template>

                    </div>



                    <!-- =============================================
                         EMPTY STATE
                    ============================================== -->

                    <template if:false={hasSelections}>

                        <div class="empty-state">

                            <div class="empty-icon">
                                +
                            </div>

                            <h3>
                                No products selected
                            </h3>

                            <p>
                                Select products from the left to
                                build your quote.
                            </p>

                        </div>

                    </template>



                    <!-- =============================================
                         SELECTED PRODUCTS
                    ============================================== -->

                    <template if:true={hasSelections}>

                        <div class="selected-products">

                            <template
                                for:each={selectedProducts}
                                for:item="item"
                            >

                                <div
                                    key={item.id}
                                    class="summary-item"
                                >

                                    <div class="summary-item-info">

                                        <div class="summary-item-name">
                                            {item.name}
                                        </div>

                                    </div>


                                    <!-- QUANTITY -->

                                    <div class="summary-quantity">

                                        <lightning-input
                                            type="number"
                                            min="1"
                                            value={item.quantity}
                                            data-id={item.id}
                                            variant="label-hidden"
                                            onchange={handleQuantityChange}
                                        >
                                        </lightning-input>

                                    </div>


                                    <!-- PRICE -->

                                    <div class="summary-item-price">

                                        {item.displayPrice}

                                    </div>


                                    <!-- REMOVE -->

                                    <button
                                        class="remove-button"
                                        data-id={item.id}
                                        onclick={handleRemove}
                                        title="Remove"
                                    >
                                        ×
                                    </button>

                                </div>

                            </template>

                        </div>



                        <!-- =========================================
                             TOTAL
                        ========================================== -->

                        <div class="summary-total">

                            <span>
                                Estimated Total
                            </span>

                            <strong>
                                {displayTotal}
                            </strong>

                        </div>


                        <p class="estimate-note">

                            This is an estimated quote. Final pricing
                            may vary based on your selections and
                            applicable requirements.

                        </p>


                        <!-- =========================================
                             VIEW / SAVE
                        ========================================== -->

                        <button
    class="quote-button"
    onclick={handleViewQuote}
    disabled={isSavingQuote}
>
    <template if:true={isSavingQuote}>
        Creating Quote...
    </template>

    <template if:false={isSavingQuote}>
        View / Save Quote
    </template>
</button>

                    </template>

                </aside>

            </div>

        </template>


        <!-- =====================================================
             NO PRODUCTS
        ====================================================== -->

        <template if:false={isLoading}>

            <template if:false={hasError}>

                <template if:false={hasProducts}>

                    <div class="empty-products-state">

                        <h3>
                            No products are currently available.
                        </h3>

                        <p>
                            Please contact NeuroTools if you need
                            assistance requesting a quote.
                        </p>

                    </div>

                </template>

            </template>

        </template>

    </div>

</template>
